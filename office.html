<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng 3D · Affiliate MXH</title>
<style>
:root { color-scheme: dark; font: 16px/1.45 system-ui,sans-serif; background: #0c171d; color: #ecf4f4; }
* { box-sizing: border-box; }
body { margin: 0; }
header { padding: 1.5rem clamp(1rem,4vw,4rem); border-bottom: 1px solid #29464b; }
header a { color: #8fe1cf; }
h1 { margin: .4rem 0; font-size: clamp(1.7rem,4vw,3rem); }
header p { margin: .2rem 0; color: #bacfd0; }
main { padding: 1.25rem clamp(1rem,4vw,4rem); display: grid; grid-template-columns: minmax(0, 3fr) minmax(16rem, 1fr); gap: 1.25rem; }
.controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
button { font: inherit; color: inherit; cursor: pointer; }
.controls button { padding:.45rem .75rem; border:1px solid #547479; border-radius:.5rem; background:#193039; }
.stage { perspective: 1400px; padding: 2rem .5rem 3rem; }
.plan { --tilt: 27deg; --turn: 0deg; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.65rem; transform:rotateX(var(--tilt)) rotateZ(var(--turn)); transform-style:preserve-3d; transition:transform .25s ease; }
.room { position:relative; text-align:left; min-height:6.5rem; padding:.6rem; border:2px solid #4a8590; border-radius:.4rem; background:linear-gradient(138deg,#294c57,#173138); box-shadow: 0 7px 0 #10232b, 2px 11px 14px #0007; display:flex; flex-direction:column; justify-content:end; align-items:start; overflow-wrap:anywhere; }
.room strong { z-index:1; }
small { display:block; color:#b8d6d5; }
.room.busy { border-color:#e3ad5d; background:linear-gradient(138deg,#59452e,#332c25); }
.room[aria-pressed="true"] { outline:3px solid #f4ebe0; outline-offset:2px; }
.desk { display:block; margin:0 0 .5rem .3rem; width:1.8rem; height:.75rem; border-radius:.15rem; background:#79b9ad; box-shadow: 0 .26rem #3a7574, .1rem .4rem .2rem #081a20; transform:skewX(-15deg); }
.busy .desk { background:#fac870; }
aside { min-width:0; padding:1rem; background:#13262d; border:1px solid #29464b; border-radius:.75rem; overflow-wrap:anywhere; }
h2 { margin-top:0; }
.panel ul { padding-left:1.25rem; }
.panel li { padding:.5rem 0; border-bottom:1px solid #29464b; }
.panel p { white-space:pre-wrap; }
@media(max-width:900px) { main {grid-template-columns:1fr;} }
@media(max-width:560px) {.plan {grid-template-columns:repeat(3,minmax(0,1fr));}.room {font-size:.88rem;} }
@media(prefers-reduced-motion:reduce) {.plan {transition:none;} }
</style>
</head>
<body>
<header>
  <a href="/">Quay về dashboard</a>
  <h1>Văn phòng 3D</h1>
  <p>20 phòng ban · Phòng sáng vàng có phiếu đang thực hiện.</p>
  <p>Trạng thái lấy từ phiếu công việc trong dashboard và do người dùng cập nhật.</p>
</header>
<main>
  <div>
    <div class="controls" aria-label="Góc nhìn văn phòng">
      <button type="button" id="left">Xoay trái</button>
      <button type="button" id="right">Xoay phải</button>
      <button type="button" id="flat" aria-pressed="false">Nhìn từ trên</button>
      <button type="button" id="refresh">Cập nhật phiếu</button>
    </div>
    <div class="stage"><div class="plan" id="plan"><!--ROOM_TILES--></div></div>
  </div>
  <aside aria-label="Chi tiết phòng" aria-live="polite">
    <p id="intro">Chọn một phòng để xem người phụ trách và kết quả bàn giao.</p>
    <!--ROOM_PANELS-->
  </aside>
</main>
<script>
const plan = document.querySelector('#plan');
let angle = 0;
function rotate(delta) {
  angle = Math.max(-24, Math.min(24, angle + delta));
  plan.style.setProperty('--turn', angle + 'deg');
}
document.querySelector('#left').onclick = () => rotate(-8);
document.querySelector('#right').onclick = () => rotate(8);
document.querySelector('#refresh').onclick = () => location.reload();
document.querySelector('#flat').onclick = (event) => {
  const button = event.currentTarget;
  const flat = button.getAttribute('aria-pressed') !== 'true';
  button.setAttribute('aria-pressed', flat);
  button.textContent = flat ? 'Góc nhìn 3D' : 'Nhìn từ trên';
  plan.style.setProperty('--tilt', flat ? '0deg' : '27deg');
  angle = 0;
  rotate(0);
};
let selected = null;
plan.addEventListener('click', (event) => {
  const room = event.target.closest('[data-room]');
  if (!room) return;
  if (selected) {
    selected.setAttribute('aria-pressed', false);
    document.getElementById(selected.getAttribute('aria-controls')).hidden = true;
  }
  selected = room;
  selected.setAttribute('aria-pressed', true);
  document.getElementById('intro').hidden = true;
  document.getElementById(room.getAttribute('aria-controls')).hidden = false;
});
</script>
</body>
</html>
